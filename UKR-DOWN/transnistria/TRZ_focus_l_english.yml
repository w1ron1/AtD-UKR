TRZ_rally_in_tiraspol:0 "Мітинг у Тирасполі"
TRZ_rally_in_tiraspol_desc:0 "Нещодавній мітинг у Тирасполі викликав нове відчуття єдності серед жителів Придністров'я. Вони відчувають нову гордість за свою ідентичність і рішучість відстоювати свої переконання. Мітинг став потужним проявом сили і солідарності, і він залишив незабутнє враження в регіоні."
TRZ_militarization:0 "Мілітаризація"
TRZ_militarization_desc:0 "Наша армія - це практично цивільні воєнізовані формування. Нам потрібно зробити з них справжню армію."
TRZ_increase_army_size:0 "Збільшити чисельність армії"
TRZ_increase_army_size_desc:0 "У нас досить невелика армія, і ми не можемо досягти реального прогресу з нашим нинішнім розміром. Найкращим виходом є збільшення чисельності."
TRZ_ask_for_russian_jets:0 "Попросити російські літаки"
TRZ_ask_for_russian_jets_desc:0 "Test"
TRZ_air_recruitment_adverts:0 "Оголошення про набір в авіацію"
TRZ_air_recruitment_adverts_desc:0 "Test"
TRZ_appoint_igor_gorgan:0 "Призначити Ігоря Ґоргана"
TRZ_appoint_igor_gorgan_desc:0 "Test"
TRZ_join_the_csto:0 "Вступ до ОДКБ"
TRZ_join_the_csto_desc:0 "Претензії Молдови загрожують нам щодня. Ми повинні звернутися за захистом до ОДКБ, поки не пізно."
TRZ_consruct_ukrainian_forts:0 "Будувати українські фортеці"
TRZ_consruct_ukrainian_forts_desc:0 "Замість того, щоб витрачати смішні суми на нашу армію, ми можемо інвестувати у фортифікаційні споруди, щоб запобігти прориву українських військ через наші кордони."
TRZ_blackmail_moldova:0 "Шантажувати Молдову"
TRZ_blackmail_moldova_desc:0 "Ми загнали Молдову в глухий кут, з якого немає виходу. Ми повинні вимагати від них покірності, інакше вони розваляться."
TRZ_declare_the_moldovan_ssr:0 "Проголосити Молдавську РСР"
TRZ_declare_the_moldovan_ssr_desc:0 "Що ж, це було легко. Незабаром ми оголосимо нашому народу нову Молдавську РСР."
