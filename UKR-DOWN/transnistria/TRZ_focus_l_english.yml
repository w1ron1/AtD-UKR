TRZ_crush_azov_rebels:0 "Розгромити азовських повстанців"
TRZ_crush_azov_rebels_desc:0 "Українські-азовські повстанці є забруднювачем східноєвропейського регіону, а точніше - планети. Ми проведемо спецоперацію, знищивши їх таємний осередок у власній країні."
