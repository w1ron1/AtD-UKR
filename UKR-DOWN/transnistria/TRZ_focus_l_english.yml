TRZ_crimeatriaspol_railway:0 "Крим-Тираспольська залізниця"
TRZ_crimeatriaspol_railway_desc:0 "Будівництво залізниці між Кримом і Тирасполем було б вигідним як для наших урядів, так і для наших народів. Це може стати початком нової дружби!"
TRZ_empower_krasnoselsky:0 "Уповноважити Красносельського"
TRZ_empower_krasnoselsky_desc:0 "Test"
TRZ_stop_russian_gun_exports:0 "Зупинити експорт російської зброї"
TRZ_stop_russian_gun_exports_desc:0 "s"
TRZ_concessions_to_west:0 "Поступки Заходу"
TRZ_concessions_to_west_desc:0 "Уся східна сфера є слабкою і бідною. Щоб стати потужною державою, нам потрібно працювати з американцями та рештою Заходу."
TRZ_return_volunteers:0 "Повернення волонтерів"
TRZ_return_volunteers_desc:0 "Нашим людям немає чого воювати в Україні. Коли вони реєструвалися, то пропонували воювати за Придністров'я, а не за Росію."
TRZ_declare_neutrality:0 "Проголосити нейтралітет"
TRZ_declare_neutrality_desc:0 "Test"
TRZ_keep_volunteers_in_ukraine:0 "Утримувати волонтерів в Україні"
TRZ_keep_volunteers_in_ukraine_desc:0 "Росія - один із наших найкращих друзів, і їй потрібна невелика допомога від нас. До того ж, це для доброї справи."
TRZ_secretely_supply_russia:0 "Таємне постачання в Росію"
TRZ_secretely_supply_russia_desc:0 "Russia winning its war in Ukraine would be better for us but gunning them publically could strain relations with many countries. We shall gun Russia, in private of course and declare neutrality, openly."
TRZ_continue_russian_gun_exports:0 "Продовження російського експорту зброї"
TRZ_continue_russian_gun_exports_desc:0 "There is no reason to end gun exports to Russia as we get good money from it."
TRZ_becomeputinspuppet:0 "Стати маріонеткою Путіна"
TRZ_becomeputinspuppet_desc:0 "After a very thorough research process and government meetings, the government has concluded that the best way to proceed is to begin intergration with the Russian Federation."
