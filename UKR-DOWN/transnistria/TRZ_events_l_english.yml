l_english:
transnistria.1.t:0 "Придністров'я просить літаки"
transnistria.1.d:0 "Сепаратистська держава Придністров'я звернулася до Росії з офіційним проханням надати військову допомогу у вигляді літаків. Цей запит надійшов на тлі зростання напруженості між Придністров'ям і Молдовою, коли Придністров'я звинувачує Молдову в плануванні нападу."
transnistria.1.a:0 "Чому б і ні?"

transnistria.2.t:0 "Придністровський шантаж"
transnistria.2.d:0 " "
transnistria.2.a:0 "Давай все обговоримо."
transnistria.2.b:0 "Битва почалася."